<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Navigasi & Cuaca</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main>
    <!-- 1. Perbaikan Prefer Native <select> -->
    <section class="search-section">
      <label for="search-results" class="sr-only">Hasil Pencarian</label>
      <select name="search-results" id="search-results" class="search-results">
        <option value="" disabled selected>Pilih lokasi atau hasil pencarian...</option>
        <option value="jakarta">Jakarta</option>
        <option value="surabaya">Surabaya</option>
        <option value="bali">Bali</option>
      </select>
    </section>

    <!-- 2. Perbaikan Scrollable Region Keyboard Access -->
    <section class="forecast-section">
      <h2>Prakiraan Cuaca Per Jam</h2>
      <div 
        class="hourly-list" 
        role="list" 
        id="hourly-list"
        tabindex="0"
        aria-label="Daftar prakiraan cuaca per jam (Gunakan panah atau scroll untuk navigasi)"
      >
        <div role="listitem" class="hourly-item">01:00 - 24°C</div>
        <div role="listitem" class="hourly-item">02:00 - 24°C</div>
        <div role="listitem" class="hourly-item">03:00 - 23°C</div>
        <div role="listitem" class="hourly-item">04:00 - 23°C</div>
        <div role="listitem" class="hourly-item">05:00 - 23°C</div>
        <div role="listitem" class="hourly-item">06:00 - 25°C</div>
      </div>
    </section>

    <hr class="divider">
  </main>

</body>
</html>
