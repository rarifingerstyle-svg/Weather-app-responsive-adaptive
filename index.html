<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Navigasi & Cuaca</title>
  <!-- Menghubungkan ke file CSS terpisah -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main>
    <!-- 1. Perbaikan Heading Level 1 (h1) untuk Struktur & Semantik -->
    <h1 class="page-title">Aplikasi Informasi Cuaca</h1>

    <!-- Section 1: Dropdown Pencarian -->
    <section class="search-section">
      <label for="search-results" class="sr-only">Hasil Pencarian Lokasi</label>
      <select name="search-results" id="search-results" class="search-results">
        <option value="" disabled selected>Pilih lokasi atau hasil pencarian...</option>
        <option value="jakarta">Jakarta</option>
        <option value="surabaya">Surabaya</option>
        <option value="bali">Bali</option>
      </select>
    </section>

    <!-- Section 2: Daftar Cuaca dengan Native <ul> & <li> -->
    <section class="forecast-section">
      <h2>Prakiraan Cuaca Per Jam</h2>
      
      <!-- 2. Perbaikan Native <ul> & tabindex="0" untuk Aksesibilitas Keyboard -->
      <ul 
        class="hourly-list" 
        id="hourly-list"
        tabindex="0"
        aria-label="Daftar prakiraan cuaca per jam. Gunakan tombol panah kiri atau kanan pada keyboard untuk menggeser."
      >
        <li class="hourly-item">01:00 - 24°C</li>
        <li class="hourly-item">02:00 - 24°C</li>
        <li class="hourly-item">03:00 - 23°C</li>
        <li class="hourly-item">04:00 - 23°C</li>
        <li class="hourly-item">05:00 - 23°C</li>
        <li class="hourly-item">06:00 - 25°C</li>
        <li class="hourly-item">07:00 - 26°C</li>
        <li class="hourly-item">08:00 - 28°C</li>
      </ul>
    </section>

    <!-- Pembatas Garis -->
    <hr class="divider">
  </main>
<script src="js/script.js"></script>
</body>
</html>
